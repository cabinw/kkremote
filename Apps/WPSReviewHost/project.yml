name: KKRemoteWPSReviewHost
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 98D7Z3LEF7
    ENABLE_HARDENED_RUNTIME: YES
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 157.0.0
targets:
  KKRemoteWPSReviewHost:
    type: application
    platform: macOS
    sources:
      - Sources
      - ../WPSReviewShared
      - path: ../TransportLab/Sources
        excludes: [LabApp.swift]
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabinw.kkremote.wps-review-host
        INFOPLIST_KEY_CFBundleDisplayName: KKRemote WPS 独立测试
        INFOPLIST_KEY_LSUIElement: YES
schemes:
  KKRemoteWPSReviewHost:
    build:
      targets:
        KKRemoteWPSReviewHost: all
