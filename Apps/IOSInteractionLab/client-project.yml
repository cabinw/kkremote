name: KKRemoteClientReview
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WPS_INTERACTIVE_REVIEW"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphonesimulator
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 157.0.0
targets:
  KKRemoteClientReview:
    type: application
    platform: iOS
    sources:
      - ../TransportLab/Sources
      - ../TransportLab/Resources
      - ../WPSReviewShared
      - WPSClient
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabinw.kkremote.clientreview.simulator
        INFOPLIST_KEY_CFBundleDisplayName: KKRemote 客户端验证
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ClientIntegrationTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ClientTests]
    dependencies:
      - target: KKRemoteClientReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabinw.kkremote.clientreview.tests
        TEST_TARGET_NAME: KKRemoteClientReview
schemes:
  KKRemoteClientReview:
    build:
      targets:
        KKRemoteClientReview: all
    test:
      targets: [ClientIntegrationTests]
