name: KKRemote
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: KKRemote Lab
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接您选择的 Mac，测试局域网、Tailscale 或 Surge Ponte 上的视频传输。
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 157.0.0
targets:
  KKRemoteLab:
    type: application
    platform: iOS
    info:
      path: Config/TransportLabIOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KKRemoteDefaultHost: $(KKREMOTE_DEFAULT_HOST)
        KKRemoteDefaultPairingCode: $(KKREMOTE_DEFAULT_PAIRING_CODE)
    sources:
      - Apps/TransportLab/Sources
      - Apps/TransportLab/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabinw.kkremote.lab
        CODE_SIGN_ENTITLEMENTS: Config/TransportLabIOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # The binary SDK references capture APIs; the lab never activates them.
        INFOPLIST_KEY_NSCameraUsageDescription: WebRTC 组件包含摄像头接口；当前传输实验只使用合成画面，不会启用摄像头。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: WebRTC 组件包含麦克风接口；当前传输实验没有音频轨道，不会启用麦克风。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: WebRTC
  KKRemoteLabMac:
    type: application
    platform: macOS
    sources:
      - Apps/TransportLab/Sources
      - Apps/TransportLab/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabinw.kkremote.lab.mac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/TransportLabMac.entitlements
    dependencies:
      - package: WebRTC
schemes:
  KKRemoteLab:
    build:
      targets:
        KKRemoteLab: all
    run:
      config: Debug
    archive:
      config: Release
  KKRemoteLabMac:
    build:
      targets:
        KKRemoteLabMac: all
    run:
      config: Debug
    archive:
      config: Release
