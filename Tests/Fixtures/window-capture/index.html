<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>KKRemote Window Capture Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101724;color:#e4eaf3;font:15px system-ui}header{height:66px;display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid #35445d}button{border:1px solid #526b91;background:#233755;color:white;border-radius:6px;padding:7px 14px;cursor:pointer}#clock{font:14px monospace;margin-left:auto}main{height:calc(100vh - 66px);display:grid;grid-template-columns:160px 1fr 1fr;gap:14px;padding:14px}aside{padding:12px;color:#aac4e8}article{background:#fff;color:#192b40;padding:0 24px;overflow:hidden;border-radius:4px}article h2{font-size:22px}article p{line-height:1.7}article small{font-size:12px}#code{background:#152237;color:#c2def7;font:14px/1.75 monospace;white-space:pre;padding:16px;overflow:hidden;border-radius:4px}#movie{display:none;height:calc(100vh - 66px);background:#000;position:relative}video{width:100%;height:100%;object-fit:contain}#credit{position:absolute;bottom:8px;left:16px;font-size:12px;background:#000a;padding:4px 8px}.line{height:1px;background:#1e2633;margin:8px 0}
</style>
<header><b>KKRemote · REAL browser window</b><button id="scroll">文档滚动</button><button id="play">60 fps 视频</button><button id="pause">暂停</button><span id="clock"></span></header>
<main id="docs"><aside><h3>实际 DOM 内容</h3><p>2560 × 1440 输出</p><p>60 fps 捕获上限</p><p>20 Mbps 码率上限</p><p>中文 / Latin / 细线</p><p>点击暂停检查文字。</p><p>右上时间用于可视对照；单凭它不能得出异地端到端延迟。</p></aside><article id="document"></article><div id="code"></div></main>
<section id="movie"><video id="video" src="clip.mp4" muted loop playsinline preload="auto"></video><span id="credit">Big Buck Bunny / Blender Foundation · CC BY 3.0 · 4K 60 fps source · silent test excerpt</span></section>
<script>
const doc=document.querySelector('#document'), code=document.querySelector('#code'), video=document.querySelector('video');
const fixture=new URLSearchParams(location.search).get('fixture');
if(fixture==='hdr60'){video.src='reference.mp4';document.querySelector('#credit').textContent='KKRemote generated PQ reference · 1440p / 60 fps · synthetic 10-bit code-value test';document.querySelector('#play').textContent='60 fps HDR 基准';document.title='KKRemote HDR 60fps Reference';}
if(fixture==='hdr-film'){video.src='hdr.mp4';document.querySelector('#credit').textContent='Apple developer HDR test stream · 4K / 23.976 fps original · window clock updates at display rate';document.querySelector('#play').textContent='HDR 视频（23.976 fps）';document.title='KKRemote HDR Window Test';}
const paragraph='<h2>清晰度与滚动 / Window capture</h2><p>这是浏览器实际排版的文字。检查细小汉字、标点、行间距和滚动时的可读性：窗口捕获、编码与传输都应保留内容细节。</p><p>The quick brown fox jumps over the lazy dog. 0123456789 ABC abc [] {} () +−= / |</p><small>12 px：小字号中文与 Latin text · retina detail · 1440p60</small><div class="line"></div><p>文档持续上下滚动，速度随时间变化；不通过每帧随机噪声模拟真实桌面。视频阶段播放实际 60 fps 文件。</p>';
doc.innerHTML=paragraph.repeat(24);
code.textContent=Array.from({length:400},(_,i)=>`${String(i+1).padStart(3)}  ${['// A bounded queue keeps recent frames','let width = 2560, height = 1440','capture.onFrame = frame => {','  encoder.submit(frame.timestamp)','  transport.send(encodedPayload)','} // 60 fps, bitrate ceiling 20 Mbps','const title = "真实窗口 / crisp text"','if (queue.age > deadline) dropOldFrame()'][i%8]}`).join('\n');
let mode='scroll',paused=false,start=performance.now(),last=0,rafFrames=0,maxGap=0,videoFrames=0,videoLast=0,videoGapMax=0;
function setMode(next){mode=next;paused=false;start=performance.now();doc.scrollTop=0;code.scrollTop=0;document.querySelector('#docs').style.display=next==='scroll'?'grid':'none';document.querySelector('#movie').style.display=next==='video'?'block':'none';if(next==='video'){video.currentTime=0;video.play().catch(e=>console.error(e));}else video.pause();}
document.querySelector('#scroll').onclick=()=>setMode('scroll');document.querySelector('#play').onclick=()=>setMode('video');document.querySelector('#pause').onclick=()=>{paused=!paused;if(mode==='video'){if(paused)video.pause();else video.play();}};
function tick(t){rafFrames++;if(last)maxGap=Math.max(maxGap,t-last);last=t;document.querySelector('#clock').textContent=new Date().toISOString().slice(11,23)+' · '+mode;if(!paused&&mode==='scroll'){const s=(t-start)/1000;doc.scrollTop=(s*260+180*Math.sin(s*.7))%(doc.scrollHeight-doc.clientHeight);code.scrollTop=s*180%(code.scrollHeight-code.clientHeight);}requestAnimationFrame(tick)}requestAnimationFrame(tick);
function movieFrame(now,metadata){videoFrames++;if(videoLast)videoGapMax=Math.max(videoGapMax,now-videoLast);videoLast=now;video.requestVideoFrameCallback(movieFrame)}video.requestVideoFrameCallback(movieFrame);
window.captureTest={setMode,resetStats(){rafFrames=0;maxGap=0;videoFrames=0;videoGapMax=0;videoLast=0;},stats(){return{mode,paused,rafFrames,maxGap,videoFrames,videoGapMax,videoTime:video.currentTime,videoWidth:video.videoWidth,videoHeight:video.videoHeight,videoQuality:video.getVideoPlaybackQuality().toJSON?.()??{total:video.getVideoPlaybackQuality().totalVideoFrames,dropped:video.getVideoPlaybackQuality().droppedVideoFrames},devicePixelRatio,outerWidth,outerHeight,innerWidth,innerHeight}}};
</script></html>
